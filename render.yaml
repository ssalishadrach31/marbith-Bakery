services:
  - type: web
    name: marbith-bakery-api
    runtime: node
    region: oregon
    plan: free
    buildCommand: npx --yes pnpm@10.26.1 install --frozen-lockfile && npx pnpm@10.26.1 --filter @workspace/api-server run build
    startCommand: pnpm --filter @workspace/api-server run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: COCKROACH_DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
