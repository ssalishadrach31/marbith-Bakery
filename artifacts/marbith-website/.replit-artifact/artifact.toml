kind = "web"
previewPath = "/marbith-website/"
title = "Marbith Bakery — Public Website"
version = "1.0.0"
id = "artifacts/marbith-website"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/marbith-website/" ]
localPort = 23376

[services.development]
run = "pnpm --filter @workspace/marbith-website run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/marbith-website", "run", "build" ]
publicDir = "artifacts/marbith-website/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23376"
BASE_PATH = "/marbith-website/"
